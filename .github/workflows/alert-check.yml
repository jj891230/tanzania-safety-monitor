name: 탄자니아 안전모니터 - 경보 점검

# Vercel Hobby 자체 크론은 하루 1회·±59분 오차라 재난 경보용으로 못 쓴다.
# GitHub Actions를 외부 스케줄러로 써서 무료로 15분 간격을 얻는다(공개 저장소 =
# Actions 분당 과금 없음). 함수 자체는 몇 번을 불러도 Vercel Hobby 무료 한도 안.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # 수동 실행 버튼(설정 검증용)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 경보 점검 엔드포인트 호출
        run: |
          curl -sf --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.ALERT_SECRET }}" \
            "${{ secrets.MONITOR_URL }}/api/check-alerts"
